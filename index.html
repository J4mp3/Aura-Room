<script>
(function(){
  if(location.protocol === "file:") return;
  function go(u){ location.replace(u); }
  function hay(u){ return fetch(u, { method: "HEAD", cache: "no-store" }).then(function(r){ return r.ok; }).catch(function(){ return false; }); }
  hay("web/index.html").then(function(w){ if(w) return go("web/"); return hay("tarjeta/index.html").then(function(t){ go(t ? "tarjeta/" : "app/"); }); });
})();
</script>
